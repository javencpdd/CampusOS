name: web-theme
display_name: "Web Theme"
version: "0.1.0"
description: "CampusOS administrator-provided themes for the complete user web frontend"
author: "CampusOS Team"
runtime: builtin
scope: system

events:
  subscribe: []

permissions:
  api:
    - resource: "web_theme"
      actions: ["read", "configure"]

storage:
  type: none

ui:
  contract_version: campusos.ui/v1
  surfaces:
    - id: plugin.web-theme.page.appearance
      version: v1
      type: page
      layout_role: main
      renderer: trusted-module
      module_id: core.appearance
      regions: [catalog, preview, permissions]
  routes:
    - id: plugin.web-theme.route.appearance
      path: /appearance
      surface_id: plugin.web-theme.page.appearance
      title: "界面风格"
      requires_auth: true
  navigation:
    - id: plugin.web-theme.navigation.appearance
      label: "风格"
      route_id: plugin.web-theme.route.appearance
      location: user-menu
      order: 50

config:
  default_style_pack: "campus-canvas"
  allow_user_switch: true

config_schema:
  fields:
    - key: "default_style_pack"
      label: "Default web theme"
      type: "string"
      description: "Default target:web source package under data/plugin_data/web-theme/style-packs."
      required: true
      default: "campus-canvas"
    - key: "allow_user_switch"
      label: "Allow user switching"
      type: "boolean"
      description: "Allow each user to keep a local theme selection from administrator-provided packages."
      default: true
