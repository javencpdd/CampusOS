name: personal-space
display_name: "Personal Space"
version: "0.1.0"
description: "CampusOS built-in personal homepage, style packages, and personal file storage"
author: "CampusOS Team"
runtime: builtin
scope: system

events:
  subscribe:
    - "thread.created"
    - "post.created"

permissions:
  api:
    - resource: "space"
      actions: ["read", "write"]
    - resource: "style"
      actions: ["read"]
    - resource: "space_file"
      actions: ["read", "write"]

storage:
  type: none

ui:
  contract_version: campusos.ui/v1
  surfaces:
    - id: plugin.personal-space.page.settings
      version: v1
      type: page
      layout_role: main
      renderer: trusted-module
      module_id: core.personal-space
      regions: [profile, files, style, storage]
  routes:
    - id: plugin.personal-space.route.settings
      path: /space/settings
      surface_id: plugin.personal-space.page.settings
      title: "个人空间"
      requires_auth: true
  navigation:
    - id: plugin.personal-space.navigation.settings
      label: "个人空间"
      route_id: plugin.personal-space.route.settings
      location: user-menu
      order: 30

config:
  styles_dir: "styles"
  file_root: "data/personal-space"
  file_url_prefix: "/api/v1/spaces/files"
  default_quota_mb: 10
  avatar_keep_limit: 3
  max_avatar_mb: 2
  future_storage_provider: "local"

config_schema:
  fields:
    - key: "styles_dir"
      label: "Styles directory"
      type: "string"
      description: "Built-in personal space style package directory relative to this plugin."
      required: true
      default: "styles"
    - key: "file_root"
      label: "File root"
      type: "string"
      description: "Local root directory for personal space files."
      required: true
      default: "data/personal-space"
    - key: "file_url_prefix"
      label: "File URL prefix"
      type: "string"
      description: "Public API URL prefix for personal space files."
      required: true
      default: "/api/v1/spaces/files"
    - key: "default_quota_mb"
      label: "Default quota MB"
      type: "number"
      description: "Default local storage quota assigned to each user."
      required: true
      default: 10
    - key: "avatar_keep_limit"
      label: "Avatar keep limit"
      type: "number"
      description: "Number of recent avatar source files retained per user."
      required: true
      default: 3
    - key: "max_avatar_mb"
      label: "Max avatar MB"
      type: "number"
      description: "Maximum size of a single avatar upload."
      required: true
      default: 2
    - key: "future_storage_provider"
      label: "Storage provider"
      type: "select"
      description: "Reserved provider selector for future personal cloud drive integration."
      required: true
      default: "local"
      options:
        - label: "Local"
          value: "local"
        - label: "Cloud placeholder"
          value: "cloud-placeholder"
