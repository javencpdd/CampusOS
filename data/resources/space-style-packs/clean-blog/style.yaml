schema_version: page-style-pack.v1
target: personal-space
name: clean-blog
version: 0.1.0
display_name: "Clean Blog"
author: "CampusOS Team"
description: "Folder-based personal space style pack example following the source package standard."
compatible_campusos:
  - ">=0.5.0"
delivery_contract: campusos.appearance-delivery/v1
viewport_support:
  desktop: true
  mobile: true
  mobile_breakpoint: "720px"
entry: templates/page.html
templates:
  - name: page
    path: templates/page.html
  - name: card
    path: templates/card.html
styles:
  - styles/theme.css
preview_image: preview.png
preview_images:
  desktop: preview-desktop.png
  mobile: preview-mobile.png
config_schema: config.schema.json
tokens:
  color.primary: "#2563eb"
  color.background: "#ffffff"
  color.surface: "#f8fafc"
assets:
  - name: cover
    path: assets/cover.webp
    type: image/webp
  - name: avatar-frame
    path: assets/avatar-frame.png
    type: image/png
