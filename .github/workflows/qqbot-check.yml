name: QQ documentation bot checks

on:
  pull_request:
    paths:
      - 'integrations/napcat-campusos/**'
      - 'docs-site/guide/getting-started.md'
      - 'docs-site/guide/module-plugin-resource-boundaries.md'
      - 'docs-site/guide/public-knowledge-search.md'
      - 'docs-site/guide/private-knowledge.md'
      - 'docs-site/guide/cited-rag.md'
      - 'docs-site/guide/managed-ai.md'
      - 'docs-site/deployment/development.md'
      - 'docs-site/plugins/qqbot-napcat-tutorial.md'
      - 'scripts/check-napcat-group.py'
      - 'scripts/test_napcat_group.py'
      - 'Makefile'
      - 'LICENSE'
      - '.github/workflows/qqbot-check.yml'
  push:
    paths:
      - 'integrations/napcat-campusos/**'
      - 'docs-site/**'
      - 'scripts/*napcat*'
      - 'Makefile'
      - 'LICENSE'
      - '.github/workflows/qqbot-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qqbot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: make qqbot-check
