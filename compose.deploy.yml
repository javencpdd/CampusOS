name: campusos

# One-click stack. Service definitions are reused from the independently
# runnable component Compose files under deploy/docker/components/.
services:
  postgres:
    extends:
      file: deploy/docker/components/compose.infra.yml
      service: postgres

  redis:
    extends:
      file: deploy/docker/components/compose.infra.yml
      service: redis

  nats:
    extends:
      file: deploy/docker/components/compose.infra.yml
      service: nats

  api:
    extends:
      file: deploy/docker/components/compose.api.yml
      service: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  web:
    extends:
      file: deploy/docker/components/compose.web.yml
      service: web
    depends_on:
      api:
        condition: service_healthy

  admin:
    extends:
      file: deploy/docker/components/compose.admin.yml
      service: admin
    depends_on:
      api:
        condition: service_healthy

  docs:
    extends:
      file: deploy/docker/components/compose.docs.yml
      service: docs

  maintenance:
    image: campusos-api:${CAMPUSOS_IMAGE_TAG:-0.13.0}
    profiles: ["maintenance"]
    user: "0:0"
    entrypoint: ["/sbin/tini", "--"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-campusos}
      DB_NAME: ${POSTGRES_DB:-campusos}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - campusos-data:/app/data
      - ./backups:/backups:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    networks:
      - backend

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@campusos.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me-before-use}
    ports:
      - "${API_BIND:-127.0.0.1}:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - backend
      - edge

volumes:
  postgres-data:
    external: true
    name: ${CAMPUSOS_POSTGRES_VOLUME:-campusos_postgres-data}
  redis-data:
    external: true
    name: ${CAMPUSOS_REDIS_VOLUME:-campusos_redis-data}
  nats-data:
    external: true
    name: ${CAMPUSOS_NATS_VOLUME:-campusos_nats-data}
  campusos-data:
    external: true
    name: ${CAMPUSOS_DATA_VOLUME:-campusos_campusos-data}
  pgadmin-data:
    external: true
    name: ${CAMPUSOS_PGADMIN_VOLUME:-campusos_pgadmin-data}

networks:
  backend:
    external: true
    name: ${CAMPUSOS_BACKEND_NETWORK:-campusos_backend}
  edge:
    external: true
    name: ${CAMPUSOS_EDGE_NETWORK:-campusos_edge}
