global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - campusos-v13.rules.yml

scrape_configs:
  - job_name: 'campusos'
    static_configs:
      - targets: ['host.docker.internal:9091']
    metrics_path: '/metrics'

  - job_name: 'nats'
    static_configs:
      - targets: ['host.docker.internal:8222']
    metrics_path: '/metrics'
