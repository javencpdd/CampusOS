schema: campusos.module/v1
id: feature.personal-schedule
feature_id: personal-schedule
name: personal-schedule
display_name: "Personal Schedule"
version: "0.11.0"
description: "Term schedules, spreadsheet import, week view, and calendar browsing backed by User Storage."
kind: builtin-feature
activation_mode: restart
default_enabled: true
dependencies: [core.identity, core.user-storage, core.feature-registry]
implementation: internal/modules/features/schedule
compatibility_aliases:
  - name: personal-schedule
config:
  quota_mb: 10
  max_courses: 200
  max_import_mb: 2
  future_cloud_provider: local
config_schema:
  fields:
    - key: quota_mb
      label: "Quota MB"
      type: number
      description: "Personal-space quota used when saving schedule data."
      required: true
      default: 10
    - key: max_courses
      label: "Max courses"
      type: number
      description: "Maximum course records saved for one user."
      required: true
      default: 200
    - key: max_import_mb
      label: "Max import MB"
      type: number
      description: "Maximum spreadsheet import size."
      required: true
      default: 2
    - key: future_cloud_provider
      label: "Future cloud provider"
      type: select
      default: local
      options:
        - {label: "Local", value: local}
        - {label: "Cloud placeholder", value: cloud-placeholder}
ui:
  contract_version: campusos.ui/v1
  surfaces:
    - id: module.personal-schedule.page.main
      version: v1
      type: page
      layout_role: main
      renderer: trusted-module
      module_id: core.schedule
      regions: [toolbar, calendar, timetable]
  routes:
    - id: module.personal-schedule.route.main
      path: /schedule
      surface_id: module.personal-schedule.page.main
      title: "个人课表"
      requires_auth: true
  navigation:
    - id: module.personal-schedule.navigation.main
      label: "课表"
      route_id: module.personal-schedule.route.main
      location: user-menu
      order: 40
