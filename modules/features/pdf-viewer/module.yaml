schema: campusos.module/v1
id: feature.pdf-viewer
feature_id: pdf-viewer
name: pdf-viewer
display_name: "PDF 文档预览"
version: "1.1.0-dev"
description: "内置受信任功能：为有权访问的图文文章 PDF 附件提供在线预览。"
kind: builtin-feature
activation_mode: restart
default_enabled: true
dependencies: [core.user-storage, feature.controlled-richtext-article, core.feature-registry]
implementation: web/src/modules/pdf-viewer
ui:
  contract_version: campusos.ui/v2
  surfaces:
    - id: builtin.pdf-viewer.preview
      version: v1
      type: document-preview
      layout_role: overlay
      renderer: trusted-module
      module_id: core.pdf-viewer
      presentations: [modal, drawer, fullscreen, new-tab]
      regions: [toolbar, document]
  routes:
    - id: builtin.pdf-viewer.route.preview
      path: /extensions/builtin.pdf-viewer/preview
      surface_id: builtin.pdf-viewer.preview
      title: "PDF 预览"
      requires_auth: true
