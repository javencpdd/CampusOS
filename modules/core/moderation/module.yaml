schema: campusos.module/v1
id: core.moderation
feature_id: moderation
name: moderation
display_name: "Category Moderation"
version: "0.10.0"
description: "Always-on category scope, authorization policy, audit, and integrity enforcement."
kind: core
activation_mode: always-on
default_enabled: true
dependencies: [core.identity, core.community, core.feature-registry]
implementation: internal/modules/core/moderation
compatibility_aliases:
  - name: category-moderation
config:
  allow_pin: true
  allow_lock: true
  allow_delete_post: true
config_schema:
  fields:
    - key: allow_pin
      label: "允许置顶主题"
      type: boolean
      description: "允许板块版主置顶或取消置顶其管理板块中的主题。"
      default: true
    - key: allow_lock
      label: "允许锁定主题"
      type: boolean
      description: "允许板块版主锁定或解锁其管理板块中的主题。"
      default: true
    - key: allow_delete_post
      label: "允许删除回复"
      type: boolean
      description: "允许板块版主删除其管理板块主题下的回复。"
      default: true
