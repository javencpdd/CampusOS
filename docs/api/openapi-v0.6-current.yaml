  /api/v1/admin/threads:
    get:
      operationId: threadHandler_AdminListThreads
      summary: GET /api/v1/admin/threads
      tags: [admin]
      x-campusos-stability: experimental
      x-campusos-ownership: none
      x-campusos-module-owner: core.community
      x-campusos-scope: global
      x-campusos-permission: thread:read
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ThreadListData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
