      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Thread' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    PostListData:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Post' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    NotificationListData:
