api_version: campusos.plugin/v2
host_api_version: v2
name: v2-managed-example
display_name: 校园个人便签（官方示例）
version: 0.2.0
description: 用于演示受管个人便签、文本附件和用户授权的可运行外部插件。
author: CampusOS
runtime: grpc
scope: user
type: external
permissions:
  api:
    - resource: managed_data
      actions: [read, write, delete]
  user:
    - resource: managed_data
      actions: [read, write, delete]
      purpose: Save and manage the user's private notes.
      risk: low
      revocable: true
    - resource: plugin_file
      actions: [read, write, delete]
      purpose: Attach text files to the user's private notes.
      risk: medium
      revocable: true
    - resource: plugin_search
      actions: [read]
      purpose: Include the user's declared note fields in CampusOS search.
      risk: medium
      revocable: true
managed_data:
  collections:
    - name: announcements
      owner: system
      fields:
        - name: title
          type: string
          required: true
      searchable: [title]
    - name: notes
      owner: user
      fields:
        - name: title
          type: string
          required: true
        - name: body
          type: string
      searchable: [title, body]
      filterable: [title]
      max_records: 200
      max_record_bytes: 16384
files:
  enabled: true
  allowed_mimes: [text/plain]
  allowed_extensions: [.txt]
  max_file_bytes: 1048576
  quota_bytes: 5242880
  retention: user-deletable
release:
  channel: beta
  data_schema_version: "1"
experience:
  use_cases:
    - 记录校园事务和课程备忘
    - 保存自己主动添加的文本附件
    - 了解插件授权、导出与卸载流程
  data_use: 只保存你主动创建的便签和主动上传的 txt 附件，不读取私信、密码或其他用户的私人内容。
  risk_summary: 便签和附件都位于 CampusOS 的受管用户命名空间；授权可随时撤销。
  disabled_behavior: 撤销授权或下架插件不会自动删除数据；你可以先导出，再从插件中心删除自己的数据。
  maintainer: CampusOS 官方示例
  documentation_url: /docs/help/插件相关/v2-managed-example
config:
  command: ./plugin
  extension_url: http://127.0.0.1:19091
ui:
  # The v2 contract lets a plugin request a named Surface.  CampusOS, rather
  # than the plugin, chooses and enforces the actual browser presentation.
  contract_version: campusos.ui/v2
  responsive:
    supported_viewports: [mobile, tablet, desktop]
    minimum_width: 360
    mobile_behavior: responsive
    overflow_policy: internal-only
  actions:
    - id: v2-managed-example.open-note
      label: 打开便签
      kind: open-surface
      surface_id: v2-managed-example.note-preview
      presentation: modal
  surfaces:
    - id: v2-managed-example.note-preview
      version: v1
      type: record-preview
      layout_role: overlay
      renderer: schema
      schema:
        component: stack
        children:
          - component: heading
            text: 校园个人便签
          - component: text
            text: 内容由 CampusOS 受管数据接口按当前授权提供。
      action_ids: [v2-managed-example.open-note]
      presentations: [modal, drawer, fullscreen, new-tab]
  routes:
    - id: v2-managed-example.route.notes
      path: /extensions/v2-managed-example/notes
      surface_id: v2-managed-example.note-preview
      title: 校园个人便签
      requires_auth: true
