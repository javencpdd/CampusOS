api_version: campusos.plugin/v1
host_api_version: v1
name: wasm-example
display_name: "Wasm Example"
version: "0.1.0"
description: "Minimal user-level Wasm plugin template."
author: "CampusOS"
runtime: wasm
scope: user
capabilities: [host.logs]
compatibility:
  campusos: ">=0.6.0 <0.11.0"
  host_api: "v1"
  sdk_go: "v0.10"
events:
  subscribe: ["thread.created"]
permissions:
  api:
    - resource: log
      actions: [write]
storage:
  type: none
config:
  module: plugin.wasm
  entrypoint: handle_event
  event_timeout_ms: 1000
config_schema:
  fields:
    - key: entrypoint
      label: "Entrypoint"
      type: string
      required: true
      default: handle_event
